name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Release assets can rot between releases (retagged or deleted uploads), and
  # goreleaser only pushes here on release, so without a timer nothing
  # revalidates the hashes.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Scoop's own bucket test suite (from ScoopInstaller/BucketTemplate): every
  # manifest validates against Scoop's schema, and every file passes its style
  # constraints (CRLF on checkout via .gitattributes, no BOM, final newline, no
  # trailing whitespace).
  test:
    name: Test
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need at least 2 commits to properly gather changed files for linting
          fetch-depth: 2
          path: my_bucket
          persist-credentials: false
      - name: Checkout Scoop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScoopInstaller/Scoop
          path: scoop_core
          persist-credentials: false
      - name: Install and cache test dependencies
        uses: potatoqualitee/psmodulecache@9e4b63833c22c1768d648e115a9c849afdda22a5 # v6.3
        with:
          modules-to-cache: BuildHelpers, Pester
          shell: ${{ matrix.shell }}
      - name: Run tests
        run: |
          $env:SCOOP_HOME="$(Convert-Path '.\scoop_core')"
          .\my_bucket\bin\test.ps1

  # The schema test never downloads anything, so a manifest with a stale hash
  # or a missing asset would pass it. Install every manifest for real, on both
  # architectures the manifests ship (free GitHub-hosted runners on a public
  # repo), and run the installed tool.
  #
  # On pull requests the manifests are installed from the checked-out files,
  # so the change under review is what gets tested. Everywhere else (push to
  # main, the weekly run, Run workflow) the job follows the README exactly:
  # add the bucket by its GitHub URL and install by bucket/name.
  install:
    name: Install (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: 64bit
          - runner: windows-11-arm
            arch: arm64
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Scoop
        run: |
          # Runners are elevated, and the installer refuses to run as admin
          # without -RunAsAdmin.
          Invoke-RestMethod -Uri https://get.scoop.sh -OutFile install-scoop.ps1
          .\install-scoop.ps1 -RunAsAdmin
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\scoop\shims"
      - name: Add the bucket by URL
        if: github.event_name != 'pull_request'
        run: scoop bucket add bronto-community "https://github.com/${{ github.repository }}"
      - name: Install and run every manifest
        env:
          EVENT_NAME: ${{ github.event_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          # How to check each installed tool. A manifest without an entry is
          # only checked for being installed.
          $checks = @{
            # `bronto version` prints JSON when stdout is not a terminal.
            bronto = { (bronto version | ConvertFrom-Json).version }
          }
          $manifests = Get-ChildItem bucket -Filter *.json
          if (-not $manifests) {
            Write-Output "No manifests yet; nothing to install."
            exit 0
          }
          foreach ($m in $manifests) {
            $name = $m.BaseName
            $want = (Get-Content $m.FullName -Raw | ConvertFrom-Json).version
            $source = if ($env:EVENT_NAME -eq 'pull_request') { $m.FullName } else { "bronto-community/$name" }
            Write-Output "::group::scoop install $source"
            # Scoop reports through Write-Host; 6>&1 captures that stream so
            # the chosen architecture can be checked.
            $out = scoop install $source 6>&1 | Out-String
            Write-Output $out
            if ($LASTEXITCODE -ne 0) { throw "scoop install $source failed" }
            Write-Output "::endgroup::"
            # Scoop can exit 0 after a failed hash check, so confirm the app
            # actually landed.
            $installed = scoop prefix $name
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $installed)) {
              throw "$name is not installed after scoop install"
            }
            if ($out -notmatch "\($([regex]::Escape($want))\) \[$env:ARCH\]") {
              throw "$name $want was not installed as $env:ARCH"
            }
            if ($checks.ContainsKey($name)) {
              $got = & $checks[$name]
              if ($got -ne $want) { throw "$name reports version '$got', manifest has '$want'" }
              Write-Output "$name $got ($env:ARCH) runs and reports the manifest version."
            }
          }
